# Promo worker account (promo_spread only). Isolated from Elmira.
# Session secret: TELEGRAM_SESSION_B64_PROMO1
# Profile: config/accounts/promo1.json
#
# Until the secret exists, the reusable workflow skips cleanly (no failure).
# After login + export: set secret, enable in config/accounts.json, dispatch.

name: run-account-promo1

on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:
    inputs:
      max_runtime_seconds:
        description: "Seconds to run before clean exit (default 5h55m)"
        required: false
        default: "21300"

permissions:
  contents: read

jobs:
  promo1:
    uses: ./.github/workflows/run-account.yml
    with:
      account_id: promo1
      session_name: promo1
      max_runtime_seconds: ${{ inputs.max_runtime_seconds || '21300' }}
    secrets:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64_PROMO1 }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      ADMIN_BOT_BRIDGE_URL: ${{ secrets.ADMIN_BOT_BRIDGE_URL }}
      ADMIN_BOT_BRIDGE_TOKEN: ${{ secrets.ADMIN_BOT_BRIDGE_TOKEN }}

# Auto-scaffolded by admin-bot / scripts/scaffold_account.py
# Linkdir discovery batches (search/snowball/rerank) — not a long-running bot.
# Session secret: TELEGRAM_SESSION_B64_LINKDIR3
# Profile: config/accounts/linkdir3.json

name: run-linkdir-linkdir3

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "7 11 * * *"
    - cron: "14 16 * * *"
    - cron: "21 21 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Comma steps: search,snowball,rerank"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  linkdir3:
    uses: ./.github/workflows/run-linkdir.yml
    with:
      account_id: linkdir3
      session_name: linkdir3
      steps: ${{ inputs.steps || '' }}
    secrets:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64_LINKDIR3 }}
      ADMIN_BOT_BRIDGE_URL: ${{ secrets.ADMIN_BOT_BRIDGE_URL }}
      ADMIN_BOT_BRIDGE_TOKEN: ${{ secrets.ADMIN_BOT_BRIDGE_TOKEN }}

# Login a Telegram account entirely on GitHub-hosted runners (runner IP).
# Avoids home-IP login → datacenter-IP session use (Telegram may treat that as theft).
#
# Flow (manage.ps1 OR admin-bot):
#   1) send     → request OTP on runner IP
#   2) complete → sign in + write TELEGRAM_SESSION_B64_*
#
# Credentials source (first match wins):
#   A) Admin-bot bridge (preferred for bot-driven login):
#        secrets.ADMIN_BOT_BRIDGE_URL + ADMIN_BOT_BRIDGE_TOKEN
#        GET {url}/internal/login/{account_id}?action=send|complete
#   B) Temporary repo secrets (manage.ps1):
#        LOGIN_PHONE / LOGIN_OTP / LOGIN_2FA
#
# Required one-time secret:
#   REPO_SECRETS_TOKEN = PAT that can write repository secrets
#   Classic: repo scope | Fine-grained: Secrets: Read and write

name: login-account

on:
  workflow_dispatch:
    inputs:
      action:
        description: "send = request OTP | complete = finish login + save session secret"
        required: true
        type: choice
        options:
          - send
          - complete
          - export-secret
      account_id:
        description: "Account id from config/accounts.json (e.g. promo1, promo2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: login-${{ inputs.account_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          rm -rf ./* ./.[!.]* 2>/dev/null || true
          git clone --depth 1 --branch master \
            "https://github.com/${GITHUB_REPOSITORY}.git" repo
          shopt -s dotglob
          mv repo/* .
          rm -rf repo

      - name: Resolve account
        id: acc
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          acc = os.environ["ACCOUNT_ID"].strip()
          rows = json.loads(Path("config/accounts.json").read_text(encoding="utf-8"))["accounts"]
          row = next((r for r in rows if r.get("id") == acc), None)
          if not row:
              print(f"::error::Unknown account_id={acc!r}. Scaffold it first (manage.ps1 account-add).")
              sys.exit(1)
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write(f"session_name={row['session_name']}\n")
              fh.write(f"session_secret={row['session_secret']}\n")
          print(f"account={acc} session={row['session_name']} secret={row['session_secret']}")
          PY
        env:
          ACCOUNT_ID: ${{ inputs.account_id }}

      - name: Resolve login credentials
        id: creds
        env:
          ACCOUNT_ID: ${{ inputs.account_id }}
          ACTION: ${{ inputs.action }}
          BRIDGE_URL: ${{ secrets.ADMIN_BOT_BRIDGE_URL }}
          BRIDGE_URL_VAR: ${{ vars.ADMIN_BOT_BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.ADMIN_BOT_BRIDGE_TOKEN }}
          BRIDGE_TOKEN_VAR: ${{ vars.ADMIN_BOT_BRIDGE_TOKEN }}
          LOGIN_PHONE_SECRET: ${{ secrets.LOGIN_PHONE }}
          LOGIN_OTP_SECRET: ${{ secrets.LOGIN_OTP }}
          LOGIN_2FA_SECRET: ${{ secrets.LOGIN_2FA }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request

          action = os.environ["ACTION"].strip()
          account_id = os.environ["ACCOUNT_ID"].strip()
          bridge_url = (
              (os.environ.get("BRIDGE_URL") or "").rstrip("/")
              or (os.environ.get("BRIDGE_URL_VAR") or "").rstrip("/")
              or "https://telegram-admin-bot.social-panel.workers.dev"
          )
          bridge_token = (
              os.environ.get("BRIDGE_TOKEN")
              or os.environ.get("BRIDGE_TOKEN_VAR")
              or ""
          )

          phone = ""
          otp = ""
          twofa = ""

          if bridge_url and bridge_token:
              print("Using admin-bot bridge for credentials")
              req = urllib.request.Request(
                  f"{bridge_url}/internal/login/{account_id}?action={action}",
                  headers={
                      "Authorization": f"Bearer {bridge_token}",
                      "Accept": "application/json",
                      "User-Agent": "login-account-workflow",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.loads(resp.read().decode("utf-8"))
                  if isinstance(data, dict) and data.get("ok"):
                      phone = str(data.get("phone") or "")
                      otp = str(data.get("otp") or "")
                      twofa = str(data.get("twofa") or "")
                  else:
                      print("::warning::Bridge returned unexpected payload")
              except Exception as exc:
                  print(f"::warning::Bridge fetch failed: {exc}")

          if not phone:
              phone = os.environ.get("LOGIN_PHONE_SECRET") or ""
          if not otp:
              otp = os.environ.get("LOGIN_OTP_SECRET") or ""
          if not twofa:
              twofa = os.environ.get("LOGIN_2FA_SECRET") or ""

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              for key, val in (("phone", phone), ("otp", otp), ("twofa", twofa)):
                  fh.write(f"{key}<<EOF\n{val}\nEOF\n")

          if action == "send" and not phone:
              raise SystemExit("No phone from bridge or LOGIN_PHONE secret")
          if action == "complete" and not otp:
              raise SystemExit("No OTP from bridge or LOGIN_OTP secret")
          if action == "export-secret":
              print("export-secret: no credentials required")
          print(f"Credentials resolved for action={action} (values not printed)")
          PY

      - name: Install deps
        run: |
          python3 -m pip install --upgrade --quiet pip
          python3 -m pip install --quiet -r requirements.txt

      - name: Restore login scratch (session + pending hash)
        id: scratch
        uses: actions/cache/restore@v4
        with:
          path: |
            pending_login.json
            ${{ steps.acc.outputs.session_name }}.session
            ${{ steps.acc.outputs.session_name }}.session-journal
          key: login-scratch-${{ inputs.account_id }}-${{ github.run_id }}
          restore-keys: |
            login-scratch-${{ inputs.account_id }}-

      - name: Send OTP
        if: inputs.action == 'send'
        id: send
        env:
          ACCOUNT_ID: ${{ inputs.account_id }}
          SESSION_NAME: ${{ steps.acc.outputs.session_name }}
          DATA_DIR: data/${{ inputs.account_id }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          ADMIN_BOT_BRIDGE_URL: ${{ secrets.ADMIN_BOT_BRIDGE_URL }}
          ADMIN_BOT_BRIDGE_URL_VAR: ${{ vars.ADMIN_BOT_BRIDGE_URL }}
          ADMIN_BOT_BRIDGE_TOKEN: ${{ secrets.ADMIN_BOT_BRIDGE_TOKEN }}
          ADMIN_BOT_BRIDGE_TOKEN_VAR: ${{ vars.ADMIN_BOT_BRIDGE_TOKEN }}
          LOGIN_PHONE: ${{ steps.creds.outputs.phone }}
          PHONE: ${{ steps.creds.outputs.phone }}
        run: |
          set -euo pipefail
          if [ -z "${LOGIN_PHONE}" ]; then
            echo "::error::LOGIN_PHONE empty after credential resolve"
            exit 1
          fi
          # Fresh login attempt — drop stale authorized session from a prior complete.
          rm -f "${{ steps.acc.outputs.session_name }}.session" \
                "${{ steps.acc.outputs.session_name }}.session-journal" \
                pending_login.json
          python3 scripts/gha_login.py send --phone "$LOGIN_PHONE"
          echo "OTP requested on runner IP."

      - name: Save login scratch after send
        if: inputs.action == 'send' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            pending_login.json
            ${{ steps.acc.outputs.session_name }}.session
            ${{ steps.acc.outputs.session_name }}.session-journal
          key: login-scratch-${{ inputs.account_id }}-${{ github.run_id }}

      - name: Export session secret (re-wrap / refresh)
        if: inputs.action == 'export-secret'
        env:
          ACCOUNT_ID: ${{ inputs.account_id }}
          SESSION_NAME: ${{ steps.acc.outputs.session_name }}
          DATA_DIR: data/${{ inputs.account_id }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          GH_TOKEN: ${{ secrets.REPO_SECRETS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.REPO_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::REPO_SECRETS_TOKEN missing (PAT that can write repo secrets)"
            exit 1
          fi
          if [ ! -f "${SESSION_NAME}.session" ]; then
            echo "::error::${SESSION_NAME}.session missing — complete login first on this account"
            exit 1
          fi
          python3 scripts/gha_login.py export-secret --secret-name "${{ steps.acc.outputs.session_secret }}"
          echo "Session secret refreshed."

      - name: Save login scratch after export
        if: inputs.action == 'export-secret' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            pending_login.json
            ${{ steps.acc.outputs.session_name }}.session
            ${{ steps.acc.outputs.session_name }}.session-journal
          key: login-scratch-${{ inputs.account_id }}-${{ github.run_id }}

      - name: Complete login + write session secret
        if: inputs.action == 'complete'
        env:
          ACCOUNT_ID: ${{ inputs.account_id }}
          SESSION_NAME: ${{ steps.acc.outputs.session_name }}
          DATA_DIR: data/${{ inputs.account_id }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          LOGIN_OTP: ${{ steps.creds.outputs.otp }}
          LOGIN_2FA: ${{ steps.creds.outputs.twofa }}
          ADMIN_BOT_BRIDGE_URL: ${{ secrets.ADMIN_BOT_BRIDGE_URL }}
          ADMIN_BOT_BRIDGE_URL_VAR: ${{ vars.ADMIN_BOT_BRIDGE_URL }}
          ADMIN_BOT_BRIDGE_TOKEN: ${{ secrets.ADMIN_BOT_BRIDGE_TOKEN }}
          ADMIN_BOT_BRIDGE_TOKEN_VAR: ${{ vars.ADMIN_BOT_BRIDGE_TOKEN }}
          GH_TOKEN: ${{ secrets.REPO_SECRETS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.REPO_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::REPO_SECRETS_TOKEN missing (PAT that can write repo secrets)"
            exit 1
          fi
          if [ -z "${LOGIN_OTP}" ]; then
            echo "::error::LOGIN_OTP empty after credential resolve"
            exit 1
          fi
          if [ ! -f pending_login.json ]; then
            echo "::error::pending_login.json missing — run login-send first and wait for it to finish"
            exit 1
          fi
          python3 scripts/gha_login.py complete --secret-name "${{ steps.acc.outputs.session_secret }}"
          echo "Login complete."

      - name: Save login scratch after complete
        if: inputs.action == 'complete' && success()
        uses: actions/cache/save@v4
        with:
          path: |
            pending_login.json
            ${{ steps.acc.outputs.session_name }}.session
            ${{ steps.acc.outputs.session_name }}.session-journal
          key: login-scratch-${{ inputs.account_id }}-${{ github.run_id }}

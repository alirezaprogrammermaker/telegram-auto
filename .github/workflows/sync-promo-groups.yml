name: sync-promo-groups

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade --quiet pip
          python -m pip install --quiet -r requirements.txt

      - name: Sync promo routes from linkdir
        env:
          ADMIN_BOT_BRIDGE_URL: ${{ secrets.ADMIN_BOT_BRIDGE_URL }}
          ADMIN_BOT_BRIDGE_TOKEN: ${{ secrets.ADMIN_BOT_BRIDGE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          PROMO_EXPORT_LIMIT: "500"
          PROMO_RANK_MIN: ${{ vars.PROMO_RANK_MIN || '0.5' }}
          PROMO_SOURCE_FALLBACK: ${{ vars.PROMO_SOURCE_FALLBACK || '' }}
        run: |
          python -m app.promo_group_sync

      - name: Auto-commit changed promo configs
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync promo routes from linkdir"
          file_pattern: "config/accounts/promo*.json"

      # Telethon runners only load profile at process start. Without this,
      # synced routes/sources never trigger auto_join until a manual restart.
      - name: Restart enabled promo runners
        if: steps.commit.outputs.changes_detected == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t workflows < <(ls -1 .github/workflows/run-account-promo*.yml 2>/dev/null || true)
          if [ "${#workflows[@]}" -eq 0 ]; then
            echo "no promo workflows found"
            exit 0
          fi
          for path in "${workflows[@]}"; do
            name="$(basename "$path")"
            echo "dispatch $name"
            gh workflow run "$name" --ref "${{ github.ref_name }}" || echo "dispatch failed: $name"
          done

# Long-running listener on a 6-hour cycle.
#
# Required Secrets: API_ID, API_HASH, ADMIN_PASSWORD, TELEGRAM_SESSION_B64
#   TELEGRAM_SESSION_B64 = python scripts/export_session_b64.py
#
# Design:
# - Job timeout = 6h (GitHub-hosted max). Clean exit ~5h50m via MAX_RUNTIME_SECONDS.
# - cron every 6h restarts the next window.
# - Standard runners are free for public repos (no monthly minute cap).
# - Keep the repo public for unrestricted minute usage.
# - Never run local main.py while this workflow is active (same session).

name: run-every-6h

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_runtime_seconds:
        description: "Seconds to run before clean exit (default ~5h50m)"
        required: false
        default: "21000"

concurrency:
  group: telegram-auto-listener
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data
          key: runtime-data-${{ github.run_id }}
          restore-keys: |
            runtime-data-

      - name: Restore session from Secret
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |
          python - <<'PY'
          import base64, os, pathlib, sys

          pathlib.Path("data").mkdir(exist_ok=True)
          admins = pathlib.Path("data") / "admins.json"
          if not admins.exists():
              admins.write_text('{"admin_ids":[]}\n', encoding="utf-8")

          raw = (os.environ.get("TELEGRAM_SESSION_B64") or "").strip()
          if not raw:
              print("::error::TELEGRAM_SESSION_B64 secret is missing")
              sys.exit(1)

          session = pathlib.Path("easy_seen.session")
          session.write_bytes(base64.b64decode(raw))
          print(f"Session restored from secret ({session.stat().st_size} bytes)")
          PY

      - name: Run app
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_NAME: easy_seen
          LOG_LEVEL: INFO
          MAX_RUNTIME_SECONDS: ${{ inputs.max_runtime_seconds || '21000' }}
        run: python main.py

      - name: Ensure data dir for cache
        if: always()
        run: |
          mkdir -p data
          test -f data/admins.json || echo '{"admin_ids":[]}' > data/admins.json



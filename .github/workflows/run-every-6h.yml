# Continuous Telegram listener on GitHub-hosted runners.
#
# How continuity works:
#   - Only one run may be active (concurrency group, cancel-in-progress: false).
#   - The cron fires often, so there is almost always one run sitting in the
#     queue as a standby. GitHub keeps at most one pending run per group.
#   - The moment the active run ends (6h timeout, or GitHub cancelling it),
#     the standby is promoted and starts immediately, so the gap is just the
#     job start-up time instead of waiting for the next cron tick.
#
# Secrets:
#   API_ID, API_HASH, ADMIN_PASSWORD, TELEGRAM_SESSION_B64, ADMIN_IDS (optional)
#   TELEGRAM_SESSION_B64 = python scripts/export_session_b64.py
#
# Keep the repo public: standard runners are free there with no monthly cap.
# Never run main.py locally while a run is active — Telegram invalidates a
# session that is used from two IP addresses at once.

name: run-every-6h

on:
  schedule:
    # Keeps a standby run queued behind the active one.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      max_runtime_seconds:
        description: "Seconds to run before clean exit (default ~5h50m)"
        required: false
        default: "21000"

concurrency:
  group: telegram-auto-listener
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        run: |
          set -euo pipefail
          rm -rf ./* ./.[!.]* 2>/dev/null || true
          git clone --depth 1 --branch master \
            "https://github.com/${GITHUB_REPOSITORY}.git" repo
          shopt -s dotglob
          mv repo/* .
          rm -rf repo

      - name: Install deps
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade --quiet pip
          python3 -m pip install --quiet -r requirements.txt

      - name: Prepare data + session
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, sys

          pathlib.Path("data").mkdir(exist_ok=True)
          admins = pathlib.Path("data") / "admins.json"
          if not admins.exists():
              admins.write_text('{"admin_ids":[]}\n', encoding="utf-8")

          raw = (os.environ.get("TELEGRAM_SESSION_B64") or "").strip()
          if not raw:
              print("::error::TELEGRAM_SESSION_B64 secret is missing")
              sys.exit(1)

          session = pathlib.Path("easy_seen.session")
          session.write_bytes(base64.b64decode(raw))
          print(f"Session restored ({session.stat().st_size} bytes)")
          PY

      - name: Run app
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          SESSION_NAME: easy_seen
          LOG_LEVEL: INFO
          MAX_RUNTIME_SECONDS: ${{ inputs.max_runtime_seconds || '21000' }}
          FLOOD_SLEEP_THRESHOLD: "120"
        run: python3 main.py

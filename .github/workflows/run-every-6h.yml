# 6-hour listener cycle for public-repo free runners.
#
# Secrets: API_ID, API_HASH, ADMIN_PASSWORD, TELEGRAM_SESSION_B64
# TELEGRAM_SESSION_B64 = python scripts/export_session_b64.py
#
# - timeout-minutes 360 = GitHub-hosted max job length
# - MAX_RUNTIME_SECONDS ~5h50m clean exit, cron restarts every 6h
# - No marketplace actions (avoids "Failed to resolve action download info")
# - Repo should stay public for unlimited standard-runner minutes
# - Do not run local main.py while this workflow is active

name: run-every-6h

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_runtime_seconds:
        description: "Seconds to run before clean exit (default ~5h50m)"
        required: false
        default: "21000"

concurrency:
  group: telegram-auto-listener
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        run: |
          set -euo pipefail
          rm -rf ./* ./.[!.]* 2>/dev/null || true
          git clone --depth 1 --branch master \
            "https://github.com/${GITHUB_REPOSITORY}.git" repo
          shopt -s dotglob
          mv repo/* .
          rm -rf repo

      - name: Install deps
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Prepare data + session
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, sys

          pathlib.Path("data").mkdir(exist_ok=True)
          admins = pathlib.Path("data") / "admins.json"
          if not admins.exists():
              admins.write_text('{"admin_ids":[]}\n', encoding="utf-8")

          raw = (os.environ.get("TELEGRAM_SESSION_B64") or "").strip()
          if not raw:
              print("::error::TELEGRAM_SESSION_B64 secret is missing")
              sys.exit(1)

          session = pathlib.Path("easy_seen.session")
          session.write_bytes(base64.b64decode(raw))
          print(f"Session restored ({session.stat().st_size} bytes)")
          PY

      - name: Run app
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_NAME: easy_seen
          LOG_LEVEL: INFO
          MAX_RUNTIME_SECONDS: ${{ inputs.max_runtime_seconds || '21000' }}
        run: python3 main.py

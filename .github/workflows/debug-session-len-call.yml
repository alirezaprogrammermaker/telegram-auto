name: debug-session-len-call

on:
  workflow_call:
    secrets:
      TELEGRAM_SESSION_B64:
        required: true

jobs:
  called:
    runs-on: ubuntu-latest
    steps:
      - name: Passed secret length
        env:
          SEC: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: python3 -c "import os; print('passed_secret_len', len(os.environ.get('SEC','')))"

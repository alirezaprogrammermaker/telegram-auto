# Trigger cf-admin-bot health/recovery watchdog on a schedule.

name: automation-watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      user_id:
        description: "Optional owner telegram user id"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Call admin-bot automation endpoint
        env:
          BRIDGE_URL: ${{ secrets.ADMIN_BOT_BRIDGE_URL }}
          BRIDGE_TOKEN: ${{ secrets.ADMIN_BOT_BRIDGE_TOKEN }}
          USER_ID: ${{ inputs.user_id }}
        run: |
          set -euo pipefail
          if [ -z "${BRIDGE_URL:-}" ] || [ -z "${BRIDGE_TOKEN:-}" ]; then
            echo "Missing ADMIN_BOT_BRIDGE_URL or ADMIN_BOT_BRIDGE_TOKEN"
            exit 1
          fi
          python3 <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          user_id = (os.environ.get("USER_ID") or "").strip()
          params = {}
          if user_id:
              params["user_id"] = user_id
          base = os.environ["BRIDGE_URL"].rstrip("/")
          url = base + "/internal/automation/run"
          if params:
              url += "?" + urllib.parse.urlencode(params)

          # Default Python-urllib UA is blocked by Cloudflare (HTTP 403).
          req = urllib.request.Request(
              url,
              data=b"{}",
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['BRIDGE_TOKEN']}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "telegram-auto-bridge/1.0",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  body = resp.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as exc:
              err_body = exc.read().decode("utf-8", errors="replace")[:500]
              host = urllib.parse.urlparse(base).netloc
              raise SystemExit(
                  f"watchdog HTTP {exc.code} host={host} body={err_body!r}"
              ) from None
          print(body)
          data = json.loads(body)
          if not data.get("ok"):
              raise SystemExit("watchdog returned ok=false")
          PY

# Production account: Elmira (channel_forward + digest + auto_reply)
# Session secret: TELEGRAM_SESSION_B64
# Profile: config/accounts/elmira.json

name: run-account-elmira

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_runtime_seconds:
        description: "Seconds to run before clean exit (default 5h55m)"
        required: false
        default: "21300"

permissions:
  contents: read

jobs:
  elmira:
    uses: ./.github/workflows/run-account.yml
    with:
      account_id: elmira
      session_name: easy_seen
      max_runtime_seconds: ${{ inputs.max_runtime_seconds || '21300' }}
    secrets:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}

# Periodic seed of linkdir search jobs into D1 queue.
# Requires ADMIN_BOT_BRIDGE_URL + ADMIN_BOT_BRIDGE_TOKEN repo secrets.

name: seed-linkdir-jobs

on:
  schedule:
    # Daily, ahead of the 06:00 UTC collector wave so fresh jobs are claimable.
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      expand_templates:
        description: "Also enqueue niche×suffix template queries (fa shard)"
        required: false
        type: boolean
        default: true
      query_set:
        description: "fa, en, niche, or all"
        required: false
        type: string
        default: "all"
      use_ai:
        description: "Generate extra queries with the Cloudflare AI agent"
        required: false
        type: boolean
        default: true
      ai_count:
        description: "AI queries per shard (blank = config default)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: seed-linkdir-jobs
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scheduled runs carry no inputs, so every knob needs an explicit default
    # here — otherwise an empty `use_ai` would silently seed with --no-ai.
    env:
      QUERY_SET: ${{ inputs.query_set || 'all' }}
      EXPAND_TEMPLATES: ${{ github.event_name == 'schedule' && 'true' || inputs.expand_templates }}
      USE_AI: ${{ github.event_name == 'schedule' && 'true' || inputs.use_ai }}
      AI_COUNT: ${{ inputs.ai_count || '' }}
    steps:
      - name: Checkout repo
        run: |
          set -euo pipefail
          rm -rf ./* ./.[!.]* 2>/dev/null || true
          git clone --depth 1 --branch master \
            "https://github.com/${GITHUB_REPOSITORY}.git" repo
          shopt -s dotglob
          mv repo/* .
          rm -rf repo

      - name: Install deps
        run: |
          python3 -m pip install --upgrade --quiet pip
          python3 -m pip install --quiet -r requirements.txt

      - name: Seed search jobs
        env:
          ADMIN_BOT_BRIDGE_URL: ${{ secrets.ADMIN_BOT_BRIDGE_URL }}
          ADMIN_BOT_BRIDGE_TOKEN: ${{ secrets.ADMIN_BOT_BRIDGE_TOKEN }}
        run: |
          set -euo pipefail
          args=""
          if [ "$EXPAND_TEMPLATES" = "true" ]; then
            args="$args --expand-templates"
          fi
          if [ "$USE_AI" = "true" ]; then
            args="$args --ai"
          else
            args="$args --no-ai"
          fi
          if [ -n "$AI_COUNT" ]; then
            args="$args --ai-count $AI_COUNT"
          fi
          echo "seeding query_set=$QUERY_SET ai=$USE_AI"
          python3 scripts/seed_linkdir_jobs.py --query-set "$QUERY_SET" $args
